<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM V9 | NEURAL INTERFACE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --purple: #bc13fe;
            --dark-core: #050508;
            --glass-border: rgba(0, 242, 255, 0.2);
            --font-main: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        
        body {
            background: var(--dark-core);
            color: var(--neon);
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* تأثيرات الخلفية الديناميكية */
        .cyber-bg {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .grid-lines {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 1000px;
            transform: rotateX(60deg) scale(2);
            opacity: 0.1;
            z-index: -1;
        }

        /* الحاوية الرئيسية للهيكل */
        .os-frame {
            width: 96vw;
            height: 94vh;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: grid;
            grid-template-columns: 300px 1fr 250px;
            grid-template-rows: 50px 1fr 80px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 100px rgba(0, 0, 0, 1);
            overflow: hidden;
        }

        /* شريط الحالة العلوي */
        .top-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
        }

        /* الأقسام الجانبية */
        .sidebar {
            background: rgba(0, 0, 0, 0.2);
            border-left: 1px solid var(--glass-border);
            padding: 20px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-entry { color: #888; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .log-entry span { color: var(--neon); }

        /* منطقة الموجات (الدردشة) */
        .chat-matrix {
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at center, rgba(0, 242, 255, 0.02) 0%, transparent 100%);
            scrollbar-width: none;
        }

        .packet {
            max-width: 85%;
            padding: 15px 20px;
            background: rgba(0, 242, 255, 0.03);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 4px;
            position: relative;
            animation: glitch-in 0.3s ease;
        }

        @keyframes glitch-in {
            0% { opacity: 0; transform: skewX(20deg); }
            100% { opacity: 1; transform: skewX(0); }
        }

        .packet-header {
            font-size: 9px;
            color: var(--purple);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* لوحة التحكم (الإدخال) */
        .control-deck {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid var(--glass-border);
            display: flex;
            padding: 15px 30px;
            gap: 15px;
            align-items: center;
        }

        .input-proxy {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            color: var(--neon);
            outline: none;
            border-radius: 5px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 12px 25px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-action:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 20px var(--neon);
        }

        /* واجهة الدخول */
        .gatekeeper {
            position: fixed;
            inset: 0;
            background: var(--dark-core);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-unit {
            width: 350px;
            padding: 40px;
            border: 1px solid var(--neon);
            background: rgba(0, 242, 255, 0.02);
            text-align: center;
        }

        .hidden { display: none !important; }

        .file-blob {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--purple);
            background: rgba(188, 19, 254, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="cyber-bg"></div>
    <div class="grid-lines"></div>

    <div id="gate" class="gatekeeper">
        <div class="auth-unit">
            <h1 style="letter-spacing: 10px; margin-bottom: 20px;">PHANTOM_OS</h1>
            <p style="font-size: 10px; opacity: 0.5; margin-bottom: 20px;">INPUT ACCESS SEED TO INITIALIZE NEURAL LINK</p>
            <input type="password" id="seed" style="width: 100%; padding: 12px; background: #000; border: 1px solid var(--neon); color: var(--neon); text-align: center; outline: none; margin-bottom: 20px;">
            <button onclick="initOS()" class="btn-action" style="width: 100%;">BOOT SYSTEM</button>
        </div>
    </div>

    <div id="interface" class="os-frame hidden">
        <div class="top-bar">
            <div>PHANTOM_OS // VERSION_9.0.4</div>
            <div id="clock">00:00:00</div>
            <div>STATUS: <span style="color: #0f0;">ENCRYPTED_LINK_ACTIVE</span></div>
        </div>

        <aside class="sidebar" id="logs">
            <h4 style="margin-bottom: 10px; border-bottom: 1px solid var(--neon);">SYSTEM_LOGS</h4>
            <div class="log-entry">Initializing <span>Phantom_Core</span>...</div>
            <div class="log-entry">Neural link <span>Stable</span></div>
        </aside>

        <div class="chat-matrix" id="matrix"></div>

        <aside class="sidebar" style="border-left: none; border-right: 1px solid var(--glass-border);">
            <h4 style="margin-bottom: 10px; border-bottom: 1px solid var(--purple);">ACTIVE_NODES</h4>
            <div class="log-entry">Operator: <span>الخطاب_V9</span></div>
            <div class="log-entry">Security: <span>AES_PHANTOM</span></div>
            <div class="log-entry">Packets: <span id="p-count">0</span></div>
        </aside>

        <div class="control-deck">
            <input type="file" id="up" style="display: none;" onchange="relayFile(this)">
            <button class="btn-action" style="border-color: var(--purple); color: var(--purple);" onclick="document.getElementById('up').click()">FILE</button>
            <input type="text" id="cmd" class="input-proxy" placeholder="ENTER SIGNAL PAYLOAD..." onkeypress="if(event.key==='Enter') relay()">
            <button class="btn-action" onclick="relay()">TRANSMIT</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDMGyi5UGbPoyNkTOkSxg7NvqWujDDDRe8",
        databaseURL: "https://send-f3884-default-rtdb.firebaseio.com",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let seedKey = 0;

    function initOS() {
        const val = document.getElementById('seed').value;
        if(val) {
            for(let i=0; i<val.length; i++) seedKey += val.charCodeAt(i);
            document.getElementById('gate').classList.add('hidden');
            document.getElementById('interface').classList.remove('hidden');
            addLog("User authenticated via neural seed.");
            startRelay();
        }
    }

    function phantomEnc(text, key, mode) {
        try {
            if(mode === 'enc') {
                let b = btoa(unescape(encodeURIComponent(text)));
                return b.split('').map((c, i) => ((c.charCodeAt(0) ^ (key + i)) + 5).toString(16)).join('.');
            } else {
                let b = text.split('.').map((h, i) => String.fromCharCode((parseInt(h, 16) - 5) ^ (key + i))).join('');
                return decodeURIComponent(escape(atob(b)));
            }
        } catch(e) { return "[CORRUPTED_SIGNAL]"; }
    }

    function addLog(msg) {
        const logs = document.getElementById('logs');
        const l = document.createElement("div");
        l.className = "log-entry";
        l.innerHTML = `> ${msg}`;
        logs.appendChild(l);
    }

    function relay() {
        const cmd = document.getElementById('cmd');
        if(!cmd.value) return;
        const payload = phantomEnc(cmd.value, seedKey, 'enc');
        db.ref("phantom_signals").push().set({ op: "الخطاب", data: payload, type: "txt", ts: new Date().toLocaleTimeString() });
        cmd.value = "";
    }

    function relayFile(input) {
        const file = input.files[0];
        if(!file || file.size > 10485760) return;
        addLog(`Preparing file: ${file.name}`);
        const reader = new FileReader();
        reader.onload = (e) => {
            const blob = JSON.stringify({ n: file.name, d: e.target.result });
            db.ref("phantom_signals").push().set({ op: "الخطاب", data: phantomEnc(blob, seedKey, 'enc'), type: "file", ts: new Date().toLocaleTimeString() });
            addLog("File packet transmitted.");
        };
        reader.readAsDataURL(file);
    }

    function startRelay() {
        let count = 0;
        db.ref("phantom_signals").limitToLast(20).on("child_added", (snap) => {
            const s = snap.val();
            const raw = phantomEnc(s.data, seedKey, 'dec');
            const matrix = document.getElementById('matrix');
            const p = document.createElement("div");
            p.className = "packet";
            
            let content = raw;
            if(s.type === 'file' && !raw.includes("[")) {
                const f = JSON.parse(raw);
                content = `<div class="file-blob"><span>📄 ${f.n}</span><a href="${f.d}" download="${f.n}" style="color:var(--neon); font-size:10px;">EXTRACT</a></div>`;
            }

            p.innerHTML = `
                <div class="packet-header"><span>SOURCE: ${s.op}</span><span>${s.ts}</span></div>
                <div style="color: #fff; word-break: break-all;">${content}</div>
            `;
            matrix.appendChild(p);
            matrix.scrollTop = matrix.scrollHeight;
            count++;
            document.getElementById('p-count').innerText = count;
        });
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
