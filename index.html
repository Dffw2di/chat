<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التشفير الحسابي | الخطاب</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0c29; color: #00ffcc; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .box { background: rgba(20, 30, 48, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 0 20px #00ffcc; width: 90%; max-width: 400px; text-align: center; border: 1px solid #00ffcc; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #00ffcc; background: #1b1b1b; color: white; outline: none; }
        button { width: 100%; padding: 12px; background: #00ffcc; color: #0f0c29; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #chat-screen { width: 100%; height: 100vh; max-width: 700px; display: flex; flex-direction: column; background: #0f0c29; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1b1b1b; padding: 10px 15px; border-radius: 10px; align-self: flex-start; border-left: 3px solid #00ffcc; }
        .msg b { display: block; font-size: 0.8em; color: #ff007f; }
        .input-area { padding: 20px; background: #16213e; display: flex; gap: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen" class="box">
        <h2>المفتاح العددي</h2>
        <p>أدخل رقماً سرياً للتشفير الحسابي</p>
        <input type="number" id="crypto-num" placeholder="مثلاً: 55">
        <button onclick="saveKey()">تشفير النظام</button>
    </div>

    <div id="name-screen" class="box hidden">
        <h2>الاسم المستعار</h2>
        <input type="text" id="user-name" placeholder="اكتب اسمك">
        <button onclick="enterChat()">دخول</button>
    </div>

    <div id="chat-screen" class="hidden">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
        <button id="admin-btn" class="hidden" onclick="resetDB()" style="background:#ff007f; color:white;">تصفير البيانات</button>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDMGyi5UGbPoyNkTOkSxg7NvqWujDDDRe8",
        authDomain: "send-f3884.firebaseapp.com",
        projectId: "send-f3884",
        databaseURL: "https://send-f3884-default-rtdb.firebaseio.com",
        storageBucket: "send-f3884.firebasestorage.app",
        messagingSenderId: "23628467787",
        appId: "1:23628467787:web:48654701e6b8fd380f07ce"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentUser = "";
    let mathKey = 1;

    function saveKey() {
        const val = document.getElementById('crypto-num').value;
        if(val) {
            mathKey = parseInt(val);
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }
    }

    function enterChat() {
        const name = document.getElementById('user-name').value;
        if(name) {
            currentUser = name;
            if(name === "الخطاب") document.getElementById('admin-btn').classList.remove('hidden');
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadMessages();
        }
    }

    // --- خوارزمية التشفير الحسابية الخاصة بالخطاب ---
    function encrypt(text, key) {
        return text.split('').map(char => {
            // تحويل الحرف لعدد ثم ضربه في المفتاح وجمعه مع رقم ثابت
            return (char.charCodeAt(0) * key) + 7; 
        }).join(',');
    }

    function decrypt(cipher, key) {
        try {
            return cipher.split(',').map(num => {
                // عكس العملية: طرح الثابت ثم القسمة على المفتاح
                return String.fromCharCode((parseInt(num) - 7) / key);
            }).join('');
        } catch(e) { return "🔒 مفتاح خاطئ"; }
    }

    function sendMessage() {
        const text = document.getElementById('msg-input').value;
        if(text) {
            const secretData = encrypt(text, mathKey);
            db.ref("global_chat").push().set({
                user: currentUser,
                message: secretData,
                timestamp: Date.now()
            });
            document.getElementById('msg-input').value = "";
        }
    }

    function loadMessages() {
        db.ref("global_chat").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const original = decrypt(data.message, mathKey);
            
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg";
            msgDiv.innerHTML = `<b>${data.user}</b> ${original}`;
            document.getElementById('messages').appendChild(msgDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    }

    function resetDB() {
        if(confirm("مسح الكل؟")) db.ref("global_chat").remove();
    }
</script>
</body>
</html>
