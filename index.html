<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات الخطاب الخاص</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #dfe6e9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .hidden { display: none; }
        .box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #6c5ce7; }
        button { width: 100%; padding: 15px; background: #6c5ce7; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #a29bfe; }
        
        #chat-screen { width: 100%; height: 100vh; max-width: 600px; display: flex; flex-direction: column; background: #fdfdfd; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; background: #e5ddd5; }
        .msg { background: white; padding: 10px 15px; border-radius: 15px; margin: 5px 0; align-self: flex-start; max-width: 80%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg b { display: block; font-size: 0.8em; color: #6c5ce7; margin-bottom: 3px; }
        .input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        .input-area input { margin: 0; }
        .input-area button { width: 100px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="box">
        <h2 style="color: #6c5ce7;">نظام التواصل</h2>
        <p>أدخل كلمة المرور للدخول</p>
        <input type="password" id="site-pass" placeholder="كلمة المرور">
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="name-screen" class="box hidden">
        <h2>مرحباً بك</h2>
        <p>اكتب اسمك المستعار لبدء الشات</p>
        <input type="text" id="user-name" placeholder="مثال: الخطاب">
        <button onclick="enterChat()">دخول للدردشة</button>
    </div>

    <div id="chat-screen" class="hidden">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالة...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

<script>
    // بياناتك الخاصة بمشروع send-f3884
    const firebaseConfig = {
        apiKey: "AIzaSyDMGyi5UGbPoyNkTOkSxg7NvqWujDDDRe8",
        authDomain: "send-f3884.firebaseapp.com",
        projectId: "send-f3884",
        databaseURL: "https://send-f3884-default-rtdb.firebaseio.com",
        storageBucket: "send-f3884.firebasestorage.app",
        messagingSenderId: "23628467787",
        appId: "1:23628467787:web:48654701e6b8fd380f07ce"
    };

    // تشغيل فايربيس
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentUser = "";
    const SITE_PASSWORD = "123"; // كلمة مرور الموقع

    function checkPass() {
        const pass = document.getElementById('site-pass').value;
        if(pass === SITE_PASSWORD) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        } else {
            alert("كلمة المرور خاطئة!");
        }
    }

    function enterChat() {
        const name = document.getElementById('user-name').value;
        if(name.trim() !== "") {
            currentUser = name;
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadMessages();
        }
    }

    function sendMessage() {
        const text = document.getElementById('msg-input').value;
        if(text.trim() !== "") {
            db.ref("global_chat").push().set({
                user: currentUser,
                message: text,
                timestamp: Date.now()
            });
            document.getElementById('msg-input').value = "";
        }
    }

    function loadMessages() {
        // الاستماع للرسائل الجديدة وعرضها فوراً
        db.ref("global_chat").limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg";
            msgDiv.innerHTML = `<b>${data.user}</b> ${data.message}`;
            const msgBox = document.getElementById('messages');
            msgBox.appendChild(msgDiv);
            
            // النزول لآخر رسالة تلقائياً
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    }

    // دعم زر Enter للإرسال
    document.getElementById('msg-input').addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>
</body>
</html>
