<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التواصل المشفر | الخطاب</title>
    
    <!-- مكتبات فايربيس الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- مكتبة التشفير CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .hidden { display: none !important; }
        .box { background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; border: 1px solid #0f3460; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #ff4d6d; }
        
        #chat-screen { width: 100%; height: 100vh; max-width: 700px; display: flex; flex-direction: column; background: #1a1a2e; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #16213e; padding: 10px 15px; border-radius: 12px; align-self: flex-start; max-width: 80%; border-right: 4px solid #e94560; position: relative; }
        .msg b { display: block; font-size: 0.8em; color: #4ecca3; margin-bottom: 5px; }
        .input-area { padding: 20px; background: #16213e; display: flex; gap: 10px; border-top: 1px solid #0f3460; }
        #admin-btn { background: #533483; font-size: 12px; padding: 5px; }
    </style>
</head>
<body>

    <!-- الشاشة 1: مفتاح التشفير -->
    <div id="auth-screen" class="box">
        <h2 style="color: #e94560;">تشفير الرسائل</h2>
        <p>أدخل مفتاح التشفير السري المتفق عليه</p>
        <input type="password" id="crypto-key" placeholder="مفتاح التشفير (مثلاً: 123)">
        <button onclick="saveKey()">تفعيل التشفير</button>
    </div>

    <!-- الشاشة 2: الاسم المستعار -->
    <div id="name-screen" class="box hidden">
        <h2>من أنت؟</h2>
        <input type="text" id="user-name" placeholder="اكتب اسمك هنا">
        <button onclick="enterChat()">دخول</button>
    </div>

    <!-- الشاشة 3: واجهة الدردشة -->
    <div id="chat-screen" class="hidden">
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالة مشفرة...">
            <button onclick="sendMessage()">إرسال</button>
        </div>
        <button id="admin-btn" class="hidden" onclick="resetChat()">تصفير قاعدة البيانات (خطاب فقط)</button>
    </div>

<script>
    // إعدادات فايربيس الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyDMGyi5UGbPoyNkTOkSxg7NvqWujDDDRe8",
        authDomain: "send-f3884.firebaseapp.com",
        projectId: "send-f3884",
        databaseURL: "https://send-f3884-default-rtdb.firebaseio.com",
        storageBucket: "send-f3884.firebasestorage.app",
        messagingSenderId: "23628467787",
        appId: "1:23628467787:web:48654701e6b8fd380f07ce"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentUser = "";
    let encryptionKey = "";

    function saveKey() {
        const key = document.getElementById('crypto-key').value;
        if(key.length > 0) {
            encryptionKey = key;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }
    }

    function enterChat() {
        const name = document.getElementById('user-name').value;
        if(name.trim() !== "") {
            currentUser = name;
            // إذا دخلت باسمك يظهر لك زر الحذف
            if(currentUser === "الخطاب" || currentUser === "خطاب") {
                document.getElementById('admin-btn').classList.remove('hidden');
            }
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadMessages();
        }
    }

    function sendMessage() {
        const text = document.getElementById('msg-input').value;
        if(text.trim() !== "") {
            // تشفير النص قبل إرساله لقاعدة البيانات
            const encrypted = CryptoJS.AES.encrypt(text, encryptionKey).toString();
            
            db.ref("global_chat").push().set({
                user: currentUser,
                message: encrypted,
                timestamp: Date.now()
            });
            document.getElementById('msg-input').value = "";
        }
    }

    function loadMessages() {
        db.ref("global_chat").limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            let decryptedText = "🔒 خطأ في التشفير";

            try {
                // محاولة فك تشفير الرسالة الواردة
                const bytes = CryptoJS.AES.decrypt(data.message, encryptionKey);
                decryptedText = bytes.toString(CryptoJS.enc.Utf8) || "🔒 مفتاح خاطئ";
            } catch (e) {
                decryptedText = "🔒 رسالة غير قابلة للقراءة";
            }

            const msgDiv = document.createElement("div");
            msgDiv.className = "msg";
            msgDiv.innerHTML = `<b>${data.user}</b> ${decryptedText}`;
            const msgBox = document.getElementById('messages');
            msgBox.appendChild(msgDiv);
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    }

    function resetChat() {
        if(confirm("هل تريد مسح كافة الرسائل من السيرفر؟")) {
            db.ref("global_chat").remove();
            location.reload();
        }
    }

    // دعم الإرسال بزر Enter
    document.getElementById('msg-input').addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>
</body>
</html>
